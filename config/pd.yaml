defaults:
  - hydra: default
  - paths: default
  - env: default
  - _self_

task: pdcontrol
seed: null
interval: 1

# params
baseline: False
nr_episodes: 1

env:
  rayleigh_number: 10_000
  episode_length: 300
  heater_duration: 1.5
  render_mode: rgb_array

pd:
  kp: 970
  kd: 2000
  bcT: [2, 1]
  limit: ${env.heater_limit}
  heater_duration: ${env.heater_duration}
  heater_segments: ${env.heater_segments}
  obs_shape: [3, 8, 48]
